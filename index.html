<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photon Studio - HTML Photoshop Clone</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #161922;
      --panel-border: #2a2f3a;
      --text: #f3f6ff;
      --accent: #5cc8ff;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: 64px 1fr;
      grid-template-columns: 280px 1fr 320px;
      grid-template-areas:
        "topbar topbar topbar"
        "sidebar canvas info";
      height: 100vh;
      overflow: hidden;
    }

    header {
      grid-area: topbar;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--panel-border);
      background: linear-gradient(90deg, #151925, #151a26 60%, #10131b);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    button, input, select, label {
      font: inherit;
    }

    .btn {
      background: #1e2430;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, border 120ms ease;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(92, 200, 255, 0.12);
    }

    .btn:active {
      transform: translateY(0);
    }

    .primary {
      background: linear-gradient(180deg, #2c9eff, #116bff);
      border: none;
      color: #f9fbff;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(17, 107, 255, 0.25);
    }

    .danger { border-color: var(--danger); color: var(--danger); }

    .toolbar {
      grid-area: sidebar;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 14px;
      overflow-y: auto;
    }

    .panel {
      background: #1a1f2b;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: 0.3px;
      color: #b8c2d6;
      text-transform: uppercase;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: #1f2532;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      color: #dbe7ff;
      cursor: pointer;
      transition: all 120ms ease;
      min-height: 44px;
    }

    .tool-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(92, 200, 255, 0.3);
      background: #202c3a;
    }

    .tool-btn:hover { border-color: var(--accent); }

    .slider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-panel {
      grid-area: info;
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      padding: 14px;
      overflow-y: auto;
    }

    .canvas-wrap {
      grid-area: canvas;
      position: relative;
      background: radial-gradient(circle at 30% 30%, #151a24 0, #0f1116 80%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #canvas {
      background: #fff;
      border: 1px solid #1b1f2a;
      border-radius: 10px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
      cursor: crosshair;
      touch-action: none;
    }

    .status {
      font-size: 13px;
      color: #9db4d6;
      margin-top: 6px;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 10px;
      border-radius: 12px;
      background: #1f2532;
      border: 1px solid var(--panel-border);
      cursor: pointer;
      transition: border 120ms ease, transform 120ms ease;
    }

    .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

    .history {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: #9fb3d6;
    }

    #textInput {
      position: absolute;
      display: none;
      min-width: 200px;
      padding: 6px 8px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      outline: none;
      background: rgba(14, 18, 27, 0.9);
      color: #fff;
      z-index: 10;
    }
  </style>
</head>
<body>
  <header>
    <h1>Photon Studio</h1>
    <button class="btn" id="openImage">Open Image</button>
    <button class="btn primary" id="export">Export PNG</button>
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="redo">Redo</button>
    <button class="btn danger" id="clear">Clear</button>
    <input type="file" id="fileInput" accept="image/*" hidden />
    <div class="status" id="status">Ready</div>
  </header>

  <aside class="toolbar">
    <div class="panel">
      <h2>Tools</h2>
      <div class="tool-grid" id="tools"></div>
    </div>

    <div class="panel">
      <h2>Brush</h2>
      <label>Size <input id="size" class="slider" type="range" min="1" max="80" value="16" /></label>
      <label>Opacity <input id="opacity" class="slider" type="range" min="0.05" max="1" step="0.05" value="1" /></label>
      <div class="color-control">
        <label>Color</label>
        <input type="color" id="color" value="#ff8e3c" />
      </div>
    </div>

    <div class="panel">
      <h2>Typography</h2>
      <div class="inputs">
        <label>Font Size
          <input id="fontSize" class="slider" type="range" min="10" max="120" value="36" />
        </label>
        <label>Weight
          <select id="fontWeight">
            <option>300</option>
            <option selected>400</option>
            <option>600</option>
            <option>700</option>
            <option>900</option>
          </select>
        </label>
      </div>
      <label>Font Family
        <input id="fontFamily" type="text" value="Inter, sans-serif" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--panel-border);background:#111522;color:var(--text);" />
      </label>
    </div>

    <div class="panel">
      <h2>Filters</h2>
      <div class="chip-row">
        <div class="chip" data-filter="grayscale">Grayscale</div>
        <div class="chip" data-filter="sepia">Sepia</div>
        <div class="chip" data-filter="invert">Invert</div>
        <div class="chip" data-filter="brighten">Brighten</div>
        <div class="chip" data-filter="contrast">Contrast</div>
        <div class="chip" data-filter="blur">Soft Blur</div>
        <div class="chip" data-filter="sharpen">Sharpen</div>
      </div>
    </div>
  </aside>

  <main class="canvas-wrap">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <input id="textInput" placeholder="Type and press Enter" />
  </main>

  <aside class="info-panel">
    <div class="panel">
      <h2>Details</h2>
      <div class="status" id="dimensions">1280 × 720 px</div>
      <div class="status" id="coords">x: 0 y: 0</div>
    </div>
    <div class="panel">
      <h2>History</h2>
      <div class="history" id="history"></div>
    </div>
  </aside>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const coordsEl = document.getElementById('coords');
    const dimensionsEl = document.getElementById('dimensions');
    const historyEl = document.getElementById('history');
    const textInput = document.getElementById('textInput');

    const tools = [
      { key: 'brush', label: 'Brush' },
      { key: 'eraser', label: 'Eraser' },
      { key: 'line', label: 'Line' },
      { key: 'rectangle', label: 'Rectangle' },
      { key: 'ellipse', label: 'Ellipse' },
      { key: 'text', label: 'Text' },
      { key: 'picker', label: 'Color Pick' }
    ];

    let state = {
      tool: 'brush',
      color: '#ff8e3c',
      size: 16,
      opacity: 1,
      isDrawing: false,
      start: null,
      history: [],
      future: [],
      fontSize: 36,
      fontFamily: 'Inter, sans-serif',
      fontWeight: '400',
    };

    function setStatus(text) { statusEl.textContent = text; }

    function pushHistory(label = 'edit') {
      state.future = [];
      state.history.push({ label, data: ctx.getImageData(0, 0, canvas.width, canvas.height) });
      if (state.history.length > 30) state.history.shift();
      renderHistory();
    }

    function renderHistory() {
      historyEl.innerHTML = state.history.map((h, i) => `<div>#${i + 1} · ${h.label}</div>`).join('');
    }

    function setTool(tool) {
      state.tool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });
      setStatus(`Tool: ${tool}`);
    }

    function updateDimensions() {
      dimensionsEl.textContent = `${canvas.width} × ${canvas.height} px`;
    }

    function resizeCanvas(w, h) {
      const snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas.width = w; canvas.height = h;
      ctx.putImageData(snapshot, 0, 0);
      updateDimensions();
      pushHistory('resize');
    }

    function setBrushFromState() {
      ctx.lineWidth = state.size;
      ctx.strokeStyle = state.color;
      ctx.fillStyle = state.color;
      ctx.globalAlpha = state.opacity;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function applyFilter(filter) {
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = img.data;
      const len = d.length;

      const clamp = v => Math.max(0, Math.min(255, v));

      for (let i = 0; i < len; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        switch (filter) {
          case 'grayscale': {
            const avg = (r + g + b) / 3;
            d[i] = d[i + 1] = d[i + 2] = avg; break;
          }
          case 'sepia': {
            d[i] = clamp(0.393 * r + 0.769 * g + 0.189 * b);
            d[i + 1] = clamp(0.349 * r + 0.686 * g + 0.168 * b);
            d[i + 2] = clamp(0.272 * r + 0.534 * g + 0.131 * b);
            break;
          }
          case 'invert': {
            d[i] = 255 - r; d[i + 1] = 255 - g; d[i + 2] = 255 - b; break;
          }
          case 'brighten': {
            d[i] = clamp(r + 20); d[i + 1] = clamp(g + 20); d[i + 2] = clamp(b + 20); break;
          }
          case 'contrast': {
            const factor = 1.15;
            d[i] = clamp((r - 128) * factor + 128);
            d[i + 1] = clamp((g - 128) * factor + 128);
            d[i + 2] = clamp((b - 128) * factor + 128);
            break;
          }
          case 'blur':
          case 'sharpen': {
            // Handled later via convolution
            break;
        }
      }

      if (filter === 'blur' || filter === 'sharpen') {
        convolve(filter === 'blur' ? [
          1/16, 2/16, 1/16,
          2/16, 4/16, 2/16,
          1/16, 2/16, 1/16
        ] : [
          0, -1, 0,
          -1, 5, -1,
          0, -1, 0
        ]);
      } else {
        ctx.putImageData(img, 0, 0);
        pushHistory(`filter:${filter}`);
      }
    }

    function convolve(kernel) {
      const w = canvas.width, h = canvas.height;
      const src = ctx.getImageData(0, 0, w, h);
      const dst = ctx.createImageData(w, h);
      const k = kernel;
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          let r = 0, g = 0, b = 0;
          let i = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * w + (x + kx)) * 4;
              r += src.data[idx] * k[i];
              g += src.data[idx + 1] * k[i];
              b += src.data[idx + 2] * k[i];
              i++;
            }
          }
          const di = (y * w + x) * 4;
          dst.data[di] = Math.max(0, Math.min(255, r));
          dst.data[di + 1] = Math.max(0, Math.min(255, g));
          dst.data[di + 2] = Math.max(0, Math.min(255, b));
          dst.data[di + 3] = 255;
        }
      }
      ctx.putImageData(dst, 0, 0);
      pushHistory('filter:conv');
    }

    function startDraw(pos) {
      state.isDrawing = true;
      state.start = pos;
      setBrushFromState();
      if (state.tool === 'brush' || state.tool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }
    }

    function draw(pos) {
      coordsEl.textContent = `x: ${Math.round(pos.x)} y: ${Math.round(pos.y)}`;
      if (!state.isDrawing) return;

      if (state.tool === 'brush') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (state.tool === 'eraser') {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.restore();
      }
    }

    function endDraw(pos) {
      if (!state.isDrawing) return;
      state.isDrawing = false;

      ctx.globalAlpha = state.opacity;
      ctx.globalCompositeOperation = 'source-over';

      const { start, tool } = state;
      if (tool === 'line') {
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (tool === 'rectangle') {
        const w = pos.x - start.x; const h = pos.y - start.y;
        ctx.strokeRect(start.x, start.y, w, h);
        ctx.fillStyle = state.color + Math.round(state.opacity * 255).toString(16).padStart(2, '0');
      } else if (tool === 'ellipse') {
        ctx.beginPath();
        ctx.ellipse((start.x + pos.x) / 2, (start.y + pos.y) / 2, Math.abs(pos.x - start.x) / 2, Math.abs(pos.y - start.y) / 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      pushHistory(tool);
    }

    function getPos(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function loadImage(file) {
      const img = new Image();
      img.onload = () => {
        resizeCanvas(img.width, img.height);
        ctx.drawImage(img, 0, 0);
        pushHistory('import');
        setStatus(`Loaded ${file.name}`);
      };
      img.src = URL.createObjectURL(file);
    }

    function exportImage() {
      const link = document.createElement('a');
      link.download = 'photon-studio.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function showTextInput(pos) {
      textInput.style.left = `${pos.x + 10}px`;
      textInput.style.top = `${pos.y + 10}px`;
      textInput.style.display = 'block';
      textInput.value = '';
      textInput.focus();
      textInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          ctx.save();
          ctx.globalAlpha = state.opacity;
          ctx.fillStyle = state.color;
          ctx.font = `${state.fontWeight} ${state.fontSize}px ${state.fontFamily}`;
          ctx.fillText(textInput.value, pos.x, pos.y);
          ctx.restore();
          textInput.style.display = 'none';
          pushHistory('text');
        } else if (e.key === 'Escape') {
          textInput.style.display = 'none';
        }
      };
    }

    function pickColor(pos) {
      const pixel = ctx.getImageData(pos.x, pos.y, 1, 1).data;
      const hex = `#${[pixel[0], pixel[1], pixel[2]].map(x => x.toString(16).padStart(2, '0')).join('')}`;
      state.color = hex;
      document.getElementById('color').value = hex;
      setStatus(`Picked ${hex}`);
    }

    function undo() {
      if (state.history.length === 0) return;
      const current = ctx.getImageData(0, 0, canvas.width, canvas.height);
      state.future.push(current);
      const last = state.history.pop();
      ctx.putImageData(last.data, 0, 0);
      renderHistory();
    }

    function redo() {
      if (state.future.length === 0) return;
      const current = ctx.getImageData(0, 0, canvas.width, canvas.height);
      state.history.push({ label: 'redo', data: current });
      const next = state.future.pop();
      ctx.putImageData(next, 0, 0);
      renderHistory();
    }

    // Init tool buttons
    const toolsContainer = document.getElementById('tools');
    tools.forEach(tool => {
      const btn = document.createElement('button');
      btn.textContent = tool.label;
      btn.className = 'tool-btn';
      btn.dataset.tool = tool.key;
      btn.onclick = () => setTool(tool.key);
      toolsContainer.appendChild(btn);
    });
    setTool('brush');

    // Filter chips
    document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => applyFilter(chip.dataset.filter)));

    document.getElementById('size').addEventListener('input', e => state.size = +e.target.value);
    document.getElementById('opacity').addEventListener('input', e => state.opacity = +e.target.value);
    document.getElementById('color').addEventListener('input', e => state.color = e.target.value);
    document.getElementById('fontSize').addEventListener('input', e => state.fontSize = +e.target.value);
    document.getElementById('fontWeight').addEventListener('change', e => state.fontWeight = e.target.value);
    document.getElementById('fontFamily').addEventListener('input', e => state.fontFamily = e.target.value);

    document.getElementById('openImage').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const [file] = e.target.files;
      if (file) loadImage(file);
      e.target.value = '';
    });

    document.getElementById('export').addEventListener('click', exportImage);
    document.getElementById('clear').addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); pushHistory('clear'); });
    document.getElementById('undo').addEventListener('click', undo);
    document.getElementById('redo').addEventListener('click', redo);

    canvas.addEventListener('mousedown', e => {
      const pos = getPos(e);
      if (state.tool === 'text') { showTextInput(pos); return; }
      if (state.tool === 'picker') { pickColor(pos); return; }
      startDraw(pos);
    });

    canvas.addEventListener('mousemove', e => {
      const pos = getPos(e);
      draw(pos);
    });

    window.addEventListener('mouseup', e => {
      const pos = getPos(e);
      endDraw(pos);
    });

    canvas.addEventListener('touchstart', e => { const pos = getPos(e); if (state.tool === 'text') { showTextInput(pos); return; } startDraw(pos); });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(getPos(e)); });
    canvas.addEventListener('touchend', e => { endDraw(getPos(e)); });

    window.addEventListener('resize', () => {
      const bounds = document.querySelector('.canvas-wrap').getBoundingClientRect();
      canvas.style.maxWidth = `${bounds.width - 40}px`;
      canvas.style.maxHeight = `${bounds.height - 40}px`;
    });

    canvas.addEventListener('dblclick', e => {
      const pos = getPos(e);
      if (state.tool !== 'text') return;
      showTextInput(pos);
    });

    pushHistory('init');
    setStatus('Ready - import an image or start sketching');
    updateDimensions();
  </script>
</body>
</html>
